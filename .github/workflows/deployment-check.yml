name: Check existing Spaininter deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read Spaininter deployment paths and service names
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          command_timeout: 2m
          script: |
            set -eu
            for repository in "$HOME/spaininter/spaininter_backend" "$HOME/spaininter/spaininter_frontend"; do
              if [ -d "$repository/.git" ]; then
                printf '%s\n' "$repository"
                git -C "$repository" status --short --branch
                git -C "$repository" log -1 --format='%h %s'
              fi
            done
            if command -v docker >/dev/null 2>&1; then
              for container in $(docker ps -a --format '{{.Names}}' | grep -i spaininter); do
                docker inspect -f '{{.Name}} | workdir={{index .Config.Labels "com.docker.compose.project.working_dir"}} | compose={{index .Config.Labels "com.docker.compose.project.config_files"}} | cwd={{.Config.WorkingDir}}' "$container"
              done
            fi
